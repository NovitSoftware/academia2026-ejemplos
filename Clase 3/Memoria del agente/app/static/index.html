<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MesaYa · Memoria del agente</title>
<link rel="icon" href="/static/isotipo-blanco.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/novit.css">
<link rel="stylesheet" href="/static/memoria.css">
</head>
<body>
<header class="top">
  <img class="logo" src="/static/logo-blanco.png" alt="Novit">
  <div class="sep"></div>
  <div class="titulo"><b>MesaYa · Memoria del agente</b><span>Unidad 4 · Corto y largo plazo, escritura, olvido y riesgos</span></div>
  <img class="wm" src="/static/isotipo-blanco.png" alt="">
  <div class="der">
    <span class="pill" id="estado"><span class="dot carga"></span><span id="estado-txt">Conectando…</span>
      <select id="modelo" title="Modelo del agente" hidden></select></span>
    <label class="tog" title="Reproduce las respuestas grabadas sin llamar a Ollama"><span>Modo guion</span><input type="checkbox" id="guion"><span class="sw"></span></label>
  </div>
</header>

<main class="app">
  <aside class="col izq">
    <div class="rotulo">Cliente</div>
    <div class="usuarios" id="usuarios"></div>
    <div class="sesion-box">
      <div class="sesion-info"><b id="ses-n">Sesión 1</b><span id="ses-msg">sin mensajes</span></div>
      <button class="btn mini" id="nueva-sesion" title="Cierra la conversación: el estado se archiva y la memoria queda"><svg class="ic"><use href="/static/iconos.svg#i-refresh"/></svg>Nueva sesión</button>
    </div>
    <div class="reloj">
      <svg class="ic"><use href="/static/iconos.svg#i-calendar"/></svg>
      <span>Hoy: <b id="hoy">—</b> <em id="dias"></em></span>
      <button class="btn sec mini" id="mas30" title="Simula el paso del tiempo: TTL y decaimiento">+30 días</button>
      <button class="btn sec mini" id="hoy-btn" title="Vuelve el reloj a hoy">Hoy</button>
    </div>

    <div class="rotulo">Escenarios</div>
    <div id="escenarios"></div>

    <div class="rotulo">Memoria</div>
    <label class="tog"><span>Memoria de largo plazo</span><input type="checkbox" data-k="memoria"><span class="sw"></span></label>
    <div class="ctl"><div class="lab">Memoria conversacional</div>
      <div class="seg" data-k="estrategia"><button data-v="completa">Completa</button><button data-v="ventana">Ventana</button><button data-v="resumen">Resumen</button></div></div>
    <div class="ctl"><div class="lab">Recuerdos por turno <b id="v-k"></b></div><input type="range" min="1" max="6" data-k="k"></div>
    <div class="ctl"><div class="lab">Escritura</div>
      <div class="seg" data-k="escritura"><button data-v="caliente">En caliente</button><button data-v="segundo_plano">Segundo plano</button></div></div>
    <div class="rotulo">Política de escritura</div>
    <label class="tog"><span>Filtrar datos sensibles</span><input type="checkbox" data-k="filtrar_sensibles"><span class="sw"></span></label>
    <label class="tog"><span>Validar origen (anti-poisoning)</span><input type="checkbox" data-k="validar_origen"><span class="sw"></span></label>
    <button class="btn sec mini" id="reiniciar" style="margin-top:14px"><svg class="ic"><use href="/static/iconos.svg#i-trash"/></svg>Borrar memoria y sesiones</button>
  </aside>

  <section class="col centro">
    <div class="chat-cab">
      <span class="avatar" id="cab-avatar">L</span>
      <h3 id="cab-nombre">Lucía Fernández</h3>
      <span class="chip azul" id="cab-mem" style="margin-left:auto"></span>
    </div>
    <div class="mensajes" id="mensajes"></div>
    <div class="entrada">
      <textarea id="mensaje" placeholder="Escribile al asistente de reservas…  (Enter para enviar)"></textarea>
      <button class="btn" id="enviar"><svg class="ic"><use href="/static/iconos.svg#i-ask"/></svg>Enviar</button>
    </div>
  </section>

  <aside class="col der">
    <nav class="tabs" id="tabs">
      <button data-t="memoria" class="on"><svg class="ic"><use href="/static/iconos.svg#i-db"/></svg>Memoria</button>
      <button data-t="turno"><svg class="ic"><use href="/static/iconos.svg#i-steps"/></svg>Turno</button>
      <button data-t="contexto"><svg class="ic"><use href="/static/iconos.svg#i-layers"/></svg>Contexto</button>
      <button data-t="estado"><svg class="ic"><use href="/static/iconos.svg#i-kv"/></svg>Estado</button>
    </nav>
    <div class="panel" id="panel"></div>
  </aside>
</main>
<script src="/static/memoria.js"></script>
</body>
</html>
