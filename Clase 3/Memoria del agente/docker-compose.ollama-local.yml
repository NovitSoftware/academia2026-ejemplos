# Usa el Ollama instalado en la máquina en lugar del contenedor.
# Conviene cuando ya tenés los modelos descargados o una GPU que Ollama aprovecha.
# Lo aplica iniciar.sh automáticamente si encuentra Ollama en localhost:11434.
services:
  app:
    network_mode: host      # para llegar a localhost:11434, donde escucha Ollama por defecto
    ports: !reset []
    depends_on: !reset []
    environment:
      OLLAMA_URL: http://localhost:11434
