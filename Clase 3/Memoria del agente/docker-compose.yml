name: mesaya-memoria

services:
  # Modelos locales. La primera vez la app descarga los que falten (unos 8 GB).
  # El volumen se comparte con la demo de Calidad y grounding: se descargan una sola vez.
  ollama:
    image: ollama/ollama:0.33.2
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"   # el de respuestas y el de embeddings, sin recargar entre llamadas

  app:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5400:5400"
    environment:
      OLLAMA_URL: http://ollama:11434
      MODELO: ${MODELO:-qwen3.5:9b}
      EMBEDDINGS: bge-m3
    volumes:
      - ./grabaciones:/srv/grabaciones   # modo guion: viaja con el repositorio
      - datos:/srv/datos                 # base SQLite de la memoria
    depends_on:
      - ollama

volumes:
  ollama:
    name: academia-ollama
  datos:
